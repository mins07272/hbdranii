<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#c9b79c; --desk2:#b9a688;
  --paper:#fffdf6; --paper-edge:#e8dfc8;
  --pencil:#3b3a44; --red:#e8505b; --yellow:#f6c945; --blue:#4a90d9; --green:#58b368; --pink:#f08ab4;
  --ring:#8a8f99;
}
@media (prefers-color-scheme:dark){
  :root{ --desk:#3a342c; --desk2:#2e2923; }
}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.12),transparent 40%),
    repeating-linear-gradient(45deg,var(--desk),var(--desk) 6px,var(--desk2) 6px,var(--desk2) 7px);
  font-family:'Gaegu','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--pencil);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  overflow:hidden;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.book{
  position:relative;
  width:min(92vw,calc(74vh*0.75));
  aspect-ratio:3/4;
  perspective:2000px;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.35));
  cursor:pointer;
}
.page{
  position:absolute;inset:0;
  background:var(--paper);
  border-radius:6px 6px 10px 10px;
  border:1px solid var(--paper-edge);
  transform-origin:top center;
  transition:transform 1s cubic-bezier(.6,.05,.25,1);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:11% 9% 15%;
  display:flex;flex-direction:column;justify-content:center;gap:.35em;
  background-image:
    radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);
  background-size:7px 7px;
}
.page.flipped{transform:rotateX(180deg);pointer-events:none}
.rings{position:absolute;top:-10px;left:0;right:0;height:22px;display:flex;justify-content:space-evenly;padding:0 4%;z-index:5;pointer-events:none}
.rings i{width:10px;height:22px;border-radius:6px;background:linear-gradient(90deg,#555,var(--ring) 50%,#555);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.page::before{ /* hole punches */
  content:"";position:absolute;top:8px;left:0;right:0;height:6px;
  background:radial-gradient(circle,rgba(0,0,0,.25) 2.5px,transparent 3px) 0 0/calc(100%/14) 6px repeat-x;
  opacity:.5;
}
.line{
  display:block;word-break:keep-all;overflow-wrap:normal;text-wrap:balance;
  font-size:clamp(18px,4.8vw,28px);
  line-height:1.45;margin-bottom:.35em;
  text-align:center;
}
.line b{font-weight:700;color:var(--red)}
.line b.g{color:#2e9d50}
.line .b{color:var(--blue)}
.line .y{background:linear-gradient(transparent 60%,rgba(246,201,69,.7) 60%)}

/* cover */
.cover{align-items:center;text-align:center;gap:.2em}
.cover h1{
  font-family:'Jua','Gaegu',sans-serif;font-weight:400;
  font-size:clamp(40px,11vw,68px);line-height:1.05;transform:rotate(-3deg);
}
.cover h1 span:nth-child(1){color:var(--red)}
.cover h1 span:nth-child(2){color:var(--yellow);-webkit-text-stroke:2px var(--pencil)}
.cover h1 span:nth-child(3){color:var(--blue)}
.cover h1 span:nth-child(4){color:var(--green)}
.cover .sub{font-size:clamp(20px,5vw,28px);margin-top:.6em}
.cover svg{width:62%;margin:.4em 0}
.hint{font-size:clamp(16px,4vw,22px);opacity:.65;margin-top:.8em;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

/* page corners / doodles */
.doodle{position:absolute;width:16%;opacity:.9}
.d1{right:7%;bottom:6%}.d2{left:7%;bottom:6%}.d3{right:7%;top:9%}
.pageno{position:absolute;bottom:3.5%;left:0;right:0;text-align:center;font-size:18px;opacity:.45}


.cover h1 .nm{font-size:.52em;color:var(--pink);-webkit-text-stroke:0;display:inline-block;margin-top:.15em}
.page.has-photo{padding:10% 9% 6%;gap:.1em}
.has-photo .line{font-size:clamp(16px,4.3vw,25px)}
.polaroid{
  position:relative;align-self:center;margin-top:.7em;
  background:#fff;padding:7px 7px 20px;border:1px solid #e6e0d0;
  box-shadow:0 4px 10px rgba(0,0,0,.25);
  transform:rotate(var(--t,0deg));
  max-width:82%;
}
.polaroid img{display:block;max-width:100%;max-height:calc(min(92vw,74vh*.75)*var(--ph,.34));object-fit:cover}
.polaroid+.line{margin-top:.9em}
.tape{position:absolute;top:-11px;left:50%;width:64px;height:20px;margin-left:-32px;background:rgba(246,201,69,.7);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.2)}

.nav{display:flex;gap:14px;align-items:center}
.nav button{
  font:inherit;font-size:22px;padding:6px 20px;border:2px solid var(--pencil);background:var(--paper);color:var(--pencil);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;cursor:pointer;
}
.nav button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-size:20px;min-width:54px;text-align:center}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){
  .page{transition-duration:.01s}
  .hint{animation:none}
}
</style>
</head>
<body>

<div class="book" id="book" aria-live="polite"></div>
<div class="nav">
  <button id="prev" aria-label="이전 장">◀</button>
  <span id="count"></span>
  <button id="next" aria-label="다음 장">▶</button>
</div>
<canvas id="confetti"></canvas>

  {lines:["언니가 얼른 취뽀해서 맛있는 거 많이 사줄게 ♡","일본에서 행복한 생일 보내고 오숑","사릉한다","<span class='b'>- 민지가</span>"], photo:"TRAVEL", tilt:-2, last:true}
];

const cakeSVG = `
<svg viewBox="0 0 200 170" fill="none" stroke="#3b3a44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M100 18c-6 8-5 14 0 17 5-3 6-9 0-17z" fill="#f6c945"/>
  <path d="M100 36v22"/><path d="M60 40c-5 7-4 12 0 14 5-2 5-8 0-14z" fill="#f6c945"/><path d="M60 55v14"/>
  <path d="M140 40c-5 7-4 12 0 14 5-2 5-8 0-14z" fill="#f6c945"/><path d="M140 55v14"/>
  <path d="M40 72h120v26H40z" fill="#f08ab4"/>
  <path d="M40 72c10 12 20 0 30 10s20-8 30 2 20-10 30 0 20 4 30-12" stroke="#fff" fill="none"/>
  <path d="M28 98h144v52H28z" fill="#fff4b8"/>
  <path d="M28 124c12 10 22-8 36 0s22-8 36 0 22-8 36 0 22 6 36-4" stroke="#e8505b" fill="none"/>
  <path d="M18 152h164"/>
</svg>`;
const star = `<svg viewBox="0 0 50 50" fill="#f6c945" stroke="#3b3a44" stroke-width="2.5" stroke-linejoin="round"><path d="M25 4l6 14 15 1-11 10 4 15-14-8-14 8 4-15L4 19l15-1z"/></svg>`;
const balloon = `<svg viewBox="0 0 50 70" fill="none" stroke="#3b3a44" stroke-width="2.5" stroke-linecap="round"><ellipse cx="25" cy="22" rx="16" ry="19" fill="#e8505b"/><path d="M25 41l-3 5h6z" fill="#e8505b"/><path d="M25 46c-6 8 6 12 0 22"/></svg>`;
const heart = `<svg viewBox="0 0 50 46" fill="#f08ab4" stroke="#3b3a44" stroke-width="2.5" stroke-linejoin="round"><path d="M25 42C6 28 3 17 8 10c5-6 14-4 17 3 3-7 12-9 17-3 5 7 2 18-17 32z"/></svg>`;
const party = `<svg viewBox="0 0 60 60" fill="none" stroke="#3b3a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 55L18 22l21 21z" fill="#f6c945"/><path d="M12 40l9 9M16 30l14 14"/><path d="M30 14c4-3 4-7 2-10" stroke="#e8505b"/><path d="M42 26c5-1 8 1 10 4" stroke="#4a90d9"/><path d="M38 12l8-4" stroke="#58b368"/><circle cx="48" cy="16" r="2.5" fill="#f08ab4"/><circle cx="26" cy="8" r="2" fill="#4a90d9"/><circle cx="52" cy="40" r="2.5" fill="#e8505b"/></svg>`;
const plane = `<svg viewBox="0 0 64 50" fill="none" stroke="#3b3a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M60 4L4 22l20 7 7 17z" fill="#fff"/><path d="M60 4L24 29l1 12 7-8"/><path d="M2 40c6-2 8 4 14 2" stroke="#4a90d9" stroke-dasharray="3 5"/></svg>`;
const doodles = [party, plane, heart];

const book = document.getElementById('book');
const pages = [];

function ringsEl(){const r=document.createElement('div');r.className='rings';r.innerHTML='<i></i>'.repeat(9);return r}

// 표지
pages.push(`
  <div class="cover" style="display:contents">
    <h1><span>Happy</span><br><span>Birthday</span><br><span class="nm">Goraniiiiii ~~</span></h1>
    ${cakeSVG}
    <div class="hint">탭하거나 ▶ 로 넘겨봐</div>
  </div>`);

// 편지 페이지
letter.forEach((pg,i)=>{
  const txt = pg.lines.map((t,j)=>`<span class="line">${t}</span>`).join('');
  if(pg.photo){
    const fig = `<figure class="polaroid" style="--t:${pg.tilt||0}deg;--ph:${pg.ph||.34}"><i class="tape"></i><img src="${IMG[pg.photo]}" alt=""></figure>`;
    pages.push((pg.top ? fig + txt : txt + fig)
      + `<div class="pageno">${i+1}</div>`);
  } else if(pg.nodoodle){
    pages.push(txt + `<div class="pageno">${i+1}</div>`);
  } else {
    pages.push(txt + `<div class="doodle ${['d1','d2','d3'][i%3]}">${doodles[i%3]}</div><div class="pageno">${i+1}</div>`);
  }
});

const total = pages.length;
pages.forEach((html,i)=>{
  const p=document.createElement('section');
  p.className='page'+(i===0?' cover':'')+(i>0&&letter[i-1].photo?' has-photo':'');
  p.style.zIndex = total - i;
  p.innerHTML = html;
  p.appendChild(ringsEl());
  book.appendChild(p);
});
const els=[...book.children];

let cur=0;
const prev=document.getElementById('prev'), next=document.getElementById('next'), count=document.getElementById('count');

function render(){
  els.forEach((p,i)=>{
    p.classList.toggle('flipped', i<cur);
    p.classList.toggle('write', i===cur && i>0);
  });
  prev.disabled = cur===0;
  next.disabled = cur===total-1;
  count.textContent = cur+1+' / '+total;
  if(cur===total-1) setTimeout(burst,900);
}
function go(n){
  n=Math.max(0,Math.min(total-1,n));
  if(n===cur) return;
  cur=n; render();
}
book.addEventListener('click',e=>{
  const r=book.getBoundingClientRect();
  (e.clientY-r.top < r.height*0.18 && cur>0) ? go(cur-1) : go(cur+1);
});
prev.onclick=()=>go(cur-1);
next.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});

/* 🎉 색종이 */
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
let bits=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',size);size();
function burst(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols=['#e8505b','#f6c945','#4a90d9','#58b368','#f08ab4'];
  for(let i=0;i<120;i++) bits.push({
    x:innerWidth/2,y:innerHeight*0.4,
    vx:(Math.random()-.5)*14,vy:-Math.random()*13-2,
    w:6+Math.random()*6,h:4+Math.random()*5,
    c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3
  });
  cancelAnimationFrame(raf);tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{
    b.vy+=.35;b.x+=b.vx;b.y+=b.vy;b.vx*=.99;b.r+=b.vr;
    cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore();
  });
  bits=bits.filter(b=>b.y<cv.height+20);
  if(bits.length) raf=requestAnimationFrame(tick);
}
render();
</script>
